<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm cuối khóa</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/loginstyle.css" />
    <script
      src="https://kit.fontawesome.com/b47a1c1ea4.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <button id="backToTop" title="Lên đầu trang">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
    <nav class="navbar navbar-expand-lg bg-body-tertiary top-navbar">
      <div class="container top-container">
        <a class="navbar-brand" href="./index.html">OneNews</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#top-navbar"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="top-navbar">
          <form
            class="d-flex"
            role="search"
            onsubmit="return chucNangPhatTrien();"
          >
            <input
              class="form-control me-2"
              type="search"
              placeholder="Tìm kiếm..."
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">Tìm</button>
          </form>

          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <button id="button-lightDark" class="btn btn-outline-dark">
                🌙
              </button>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Đăng nhập</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="register.html">Đăng kí</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <nav class="navbar navbar-expand-lg bg-body-tertiary bottom-navbar">
      <div class="container">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#bottom-navbar"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse bottom-menu" id="bottom-navbar">
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Trang chủ</a
              >
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Danh mục
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Tin mới</a></li>
                <li><a class="dropdown-item" href="#">AI</a></li>
                <li><a class="dropdown-item" href="#">Game</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./contact.html">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./about.html">Giới thiệu</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="login">
      <div class="login-card">
        <h2 class="big-title">Đăng nhập</h2>
        <form action="#" method="get">
          <div class="mb-3">
            <label for="email">Tài khoản email:</label>
            <input
              type="text"
              id="email"
              name="email"
              class="form-control"
              placeholder="Nhập tài khoản email"
              required
            />
            <br />
          </div>
          <div class="mb-3">
            <label for="password">Mật khẩu: </label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Nhập mật khẩu"
              required
            />
            <br />
          </div>

          <input
            type="submit"
            value="Đăng nhập"
            class="btn btn-outline-primary w-100 mb-3"
          />
        </form>
        <div class="text-center">
          <a href="#">Quên mật khẩu?</a>
          <p class="mt-3 mb-1">Chưa có tài khoản?</p>
          <a href="./register.html"> Đăng kí </a>
        </div>
      </div>
    </div>
  </body>
  <script src="./js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
