<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm cuối khóa</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./css/registerstyle.css" />
    <script
      src="https://kit.fontawesome.com/b47a1c1ea4.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary top-navbar">
      <div class="container top-container">
        <a class="navbar-brand" href="#">OneNews</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#top-navbar"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="top-navbar">
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Tìm kiếm..."
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">Tìm</button>
          </form>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="./login.html">Đăng nhập</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./register.html">Đăng kí</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <nav class="navbar navbar-expand-lg bg-body-tertiary bottom-navbar">
      <div class="container">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#bottom-navbar"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse bottom-menu" id="bottom-navbar">
          <ul class="navbar-nav gap-5">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html"
                >Trang chủ</a
              >
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Danh mục
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Tin mới</a></li>
                <li><a class="dropdown-item" href="#">AI</a></li>
                <li><a class="dropdown-item" href="#">Game</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Liên hệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Giới thiệu</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="register">
      <div class="register-card">
        <h2 class="big-title">Đăng kí</h2>
        <form action="#" method="get">
          <div class="mb-3">
            <label for="fullname" class="form-label">Họ và tên</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              class="form-control"
              placeholder="Nhập họ và tên"
              required
            />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Tài khoản email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Nhập email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <div class="mb-3">
            <label for="confirm" class="form-label">Nhập lại mật khẩu</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              class="form-control"
              placeholder="Nhập lại mật khẩu"
              required
            />
          </div>
          <input
            type="submit"
            value="Đăng kí"
            class="btn btn-outline-success w-100 mb-3"
          />
        </form>
        <div class="text-center">
          <a href="#">Quên mật khẩu?</a>

          <p class="mt-3 mb-1">Đã có tài khoản?</p>
          <a href="./login.html"> Đăng nhập </a>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
